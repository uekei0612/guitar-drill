# 開発用。dev VM の Node は 16 で Vite が動かないので、Node 22 のコンテナで動かす。
# http://almalinux-dev.ukuenokei.duckdns.org:8008/
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "8008:8008"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - APP_ENV=dev

volumes:
  node_modules:
